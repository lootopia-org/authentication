<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Your Password</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px;">
    <tr>
      <td align="center">
        <table width="100%" max-width="480px" style="background:#ffffff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.05);padding:32px;">
          
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <h1 style="margin:0;font-size:24px;color:#111827;">
                Reset your password
              </h1>
            </td>
          </tr>

          <tr>
            <td style="color:#374151;font-size:16px;line-height:1.6;padding-bottom:24px;">
              Hi there 👋,<br /><br />
              We received a request to reset your password.
              Use the code below to proceed. This code will expire in <strong>10 minutes</strong>.
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:24px 0;">
              <div style="
                display:inline-block;
                background:#f3f4f6;
                padding:16px 32px;
                border-radius:8px;
                font-size:28px;
                font-weight:700;
                letter-spacing:6px;
                color:#111827;
              ">
                {{RESET_CODE}}
              </div>
            </td>
          </tr>

          <tr>
            <td style="color:#6b7280;font-size:14px;line-height:1.5;padding-top:24px;">
              If you didn’t request a password reset, you can safely ignore this email.
              <br /><br />
              — The Lootopia Team
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
